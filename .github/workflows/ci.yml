name: CI

# Every push and pull request: the CLI compiles and its tests pass on all three systems, against the core its
# base/ submodule pins and the page its web/ submodule pins, and the release archive can be made. Releases
# themselves are cut by Noctorium-Installer, which builds this the same way.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, and make the archive
        shell: bash
        run: ./gradlew test cliArchive --stacktrace

      - name: It runs
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            build/package/noctorium-cli/noctorium.exe version
          else
            build/package/noctorium-cli/bin/noctorium version
          fi

      # Started from a desktop's menu, as an Arch package's entry once ran it by mistake: no terminal on any of
      # its streams and no TERM, so the player cannot be drawn. It opens the window app instead -- here a
      # stand-in at the path the .deb, the .rpm and the Arch package use, which writes down that it was opened
      # and by whom -- and with no window app to open it says it needs a terminal, at once, rather than after
      # starting everything.
      - name: Started from a menu, it opens the window app
        if: runner.os == 'Linux'
        env:
          NOCTORIUM_MPV_PATH: /bin/true
          NOCTORIUM_YTDLP_PATH: /bin/true
          NOCTORIUM_CLI_HOME: ${{ runner.temp }}/cli-home
          NOCTORIUM_NO_UPDATE: "1"
        run: |
          set -u
          opened="$RUNNER_TEMP/window-app-opened"
          sudo mkdir -p /opt/noctorium/bin
          sudo tee /opt/noctorium/bin/Noctorium > /dev/null <<EOF
          #!/bin/sh
          echo "\$NOCTORIUM_OPENED_BY_CLI" > "$opened"
          EOF
          sudo chmod 755 /opt/noctorium/bin/Noctorium
          # The shell stops at the first command that fails, so each exit status is caught rather than left to it.
          status=0; env -u TERM build/package/noctorium-cli/bin/noctorium < /dev/null > menu.log 2>&1 || status=$?
          for i in $(seq 1 40); do [ -s "$opened" ] && break; sleep 0.25; done
          test "$status" -eq 0 || { echo "It exited with $status:"; cat menu.log; exit 1; }
          test "$(cat "$opened" 2>/dev/null)" = 1 || { echo "The window app was not opened:"; cat menu.log; exit 1; }
          sudo rm -rf /opt/noctorium
          started=$(date +%s)
          status=0; env -u TERM build/package/noctorium-cli/bin/noctorium < /dev/null > none.log 2>&1 || status=$?
          took=$(( $(date +%s) - started ))
          test "$status" -eq 2 || { echo "With no window app it exited with $status:"; cat none.log; exit 1; }
          grep -q "needs a terminal" none.log || { echo "It did not say it needs a terminal:"; cat none.log; exit 1; }
          test "$took" -lt 10 || { echo "It took $took s to say so"; exit 1; }

      # The player itself, in a real terminal: script(1) gives it a pseudo-terminal, and after a few
      # seconds of drawing it is sent q. mpv and yt-dlp are stood in for by true, since nothing is played --
      # and a first start would otherwise go to fetch yt-dlp, which a shared runner is often refused. The daily
      # update check is switched off too, so a run never asks GitHub about releases on a shared address.
      - name: The player opens and closes in a terminal
        if: runner.os == 'Linux'
        env:
          NOCTORIUM_MPV_PATH: /bin/true
          NOCTORIUM_YTDLP_PATH: /bin/true
          NOCTORIUM_CLI_HOME: ${{ runner.temp }}/cli-home
          NOCTORIUM_NO_UPDATE: "1"
          TERM: xterm-256color
        run: |
          set +e
          ( sleep 12; if grep -a -q NOCTORIUM tui.log; then touch drawn-before-q; fi; printf 'q' ) | timeout 90 script -qec "build/package/noctorium-cli/bin/noctorium" /dev/null > tui.log 2>&1
          status=$?
          grep -a -q NOCTORIUM tui.log || { echo "The player drew nothing:"; cat -v tui.log | tail -40; exit 1; }
          test -f drawn-before-q || { echo "Nothing was drawn until a key was pressed"; exit 1; }
          test $status -eq 0 || { echo "The player exited with $status"; cat -v tui.log | tail -40; exit 1; }

      # The same on a Mac, whose script(1) is BSD's and takes the command last, and which has no timeout(1).
      - name: The player opens and closes in a Mac terminal
        if: runner.os == 'macOS'
        env:
          NOCTORIUM_MPV_PATH: /usr/bin/true
          NOCTORIUM_YTDLP_PATH: /usr/bin/true
          NOCTORIUM_CLI_HOME: ${{ runner.temp }}/cli-home
          NOCTORIUM_NO_UPDATE: "1"
          TERM: xterm-256color
        run: |
          set +e
          ( sleep 15; if grep -a -q NOCTORIUM tui.log; then touch drawn-before-q; fi; printf 'q' ) | perl -e 'alarm 120; exec @ARGV' script -q /dev/null build/package/noctorium-cli/bin/noctorium > tui.log 2>&1
          status=$?
          grep -a -q NOCTORIUM tui.log || { echo "The player drew nothing:"; cat -v tui.log | tail -40; exit 1; }
          test -f drawn-before-q || { echo "Nothing was drawn until a key was pressed"; exit 1; }
          test $status -eq 0 || { echo "The player exited with $status"; cat -v tui.log | tail -40; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: noctorium-cli-${{ matrix.os }}
          path: build/dist/*
          retention-days: 14
